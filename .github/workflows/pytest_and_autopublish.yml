name: Unittests & Auto-publish

# Allow to trigger the workflow manually (e.g. when deps changes)
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  pytest-job:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - run: sudo apt-get update
    - run: sudo apt-get install -y ffmpeg

    # Install deps
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - run: pip --version
    - run: pip install --no-cache-dir -e .[all,dev]
    - run: pip freeze

    # Run tests
    - name: Run core tests
      run: pytest -vv -n auto

  # Auto-publish when version is increased
  publish-job:
    # Only try to publish if:
    # * Repo is self (prevents running from forks)
    # * Branch is `main`
    if: |
      github.repository == 'google/etils'
      && github.ref == 'refs/heads/main'
    needs: pytest-job  # Only publish after tests are successful
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Check version and build if new
      id: check_version
      run: |
        python -m pip install --upgrade pip build twine packaging
        python -m build
        LOCAL_VER=$(python -c "import glob, os; whl=glob.glob('dist/*.whl')[0]; print(os.path.basename(whl).split('-')[1])")
        PYPI_VER=$(python -c "import json, urllib.request; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/etils/json').read())['info']['version'])")
        echo "Local: $LOCAL_VER, PyPI: $PYPI_VER"
        if python -c "from packaging.version import Version; exit(0 if Version('$LOCAL_VER') > Version('$PYPI_VER') else 1)"; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
    - name: Clean up stale releases from staging repo
      run: |
        # clean up stale releases from staging repo
        packages=$(gcloud artifacts packages list \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="etils--pypi" \
            --format="value(name)" 2>/dev/null)

        echo "${packages}" | xargs -r -I {} sh -c '
            package_name=$(basename "{}")
            echo "Deleting package: $package_name..."
            gcloud artifacts packages delete "{}" \
                --project="\'"oss-exit-gate-prod"\'" \
                --location="\'"us"\'" \
                --repository="\'etils--pypi\'" \
                --quiet
        '

    - name: Stage to OSS Exit Gate and upload manifest
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/etils--pypi/" \
          -u oauth2accesstoken \
          -p "$(gcloud auth print-access-token)" \
          dist/*
        echo '{"publish_all": true}' > manifest.json
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/etils/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
